name: "Clean Posted Videos & Update Monitor Dashboard"

on:
  schedule:
    # Chạy tự động mỗi 30 phút
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép người dùng bấm nút chạy thủ công bất cứ lúc nào
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'index.html'

permissions:
  contents: write

jobs:
  clean-and-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Cleaner & Update Dashboard HTML
        env:
          PROJECT_SECRETS_BASE64: ${{ secrets.PROJECT_SECRETS_BASE64 }}
        run: |
          python clean_and_update_web.py

      - name: Commit & Push Dashboard Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ index.html
          if git diff --staged --quiet; then
            echo "Không có thay đổi mới nào trên Dashboard."
          else
            git commit -m "chore(monitor): auto clean posted videos & update dashboard [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
